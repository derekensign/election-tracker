name: Daily snapshot

on:
  schedule:
    # 12:07 UTC = 7:07 am Central Daylight Time (6:07 am after the November time change). Off-the-hour minutes
    # avoid GitHub's most congested scheduler slots; a second attempt follows at 13:37 UTC. The build is
    # idempotent, so same-day runs simply overwrite the day's snapshot.
    - cron: "7 12 * * *"
    - cron: "37 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build today's snapshot
        run: node ingest/build.js
      - name: Confirm the snapshot is for today (Central time)
        run: |
          today=$(TZ=America/Chicago date +%F)
          actual=$(node -e 'console.log(require("./public/data/latest.json").asOf)')
          echo "snapshot asOf=$actual today=$today"
          test "$actual" = "$today"
      - name: Commit and push data
        run: |
          git config user.name "Derek Ensign"
          git config user.email "derekensign@gmail.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "data: snapshot $(TZ=America/Chicago date +%F)"
          git push
